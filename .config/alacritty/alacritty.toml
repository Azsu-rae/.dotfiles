
[window]
padding = { x = 0, y = 0 }
decorations = "None"
startup_mode = "Maximized"
opacity = 1

[font]
size = 14.0

[font.normal]
family = "jetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

