
[window]
padding = { x = 0, y = 0 }
opacity = 1
# opacity = 0.95
decorations = "None"
startup_mode = "Maximized"

[font]
size = 14.0

[font.normal]
family = "jetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[colors.primary]
foreground = "#dcd7ba"
background = "#1f1f28"

[colors.cursor]
text = "#1f1f28"
cursor = "#dcd7ba"

[colors.selection]
text = "#c8c093"
background = "#2d4f67"

[colors.normal]
black = "#16161d"
red = "#c34043"
green = "#76946a"
yellow = "#c0a36e"
blue = "#7e9cd8"
magenta = "#957fb8"
cyan = "#6a9589"
white = "#c8c093"

[colors.bright]
black = "#727169"
red = "#e82424"
green = "#98bb6c"
yellow = "#e6c384"
blue = "#7fb4ca"
magenta = "#938aa9"
cyan = "#7aa89f"
white = "#dcd7ba"
